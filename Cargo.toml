[package]
name = "visual-audio"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
cpal = "0.18"
egui = "0.33.3"
egui-wgpu = "0.33.3"
egui-winit = "0.33.3"
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wgpu = "27.0"
winit = "0.30"

[dev-dependencies]
naga = { version = "27.0", features = ["wgsl-in"] }

[build-dependencies]
cc = "1.2"

[profile.release]
lto = "thin"
codegen-units = 1
